
<!doctype html>

  <meta property="og:description" content="we gon be ok..." />
<meta name="twitter:image" content="https://i.imgur.com/e6TR7dR.png" />
  <meta property="og:image:width" content="1200" />

  <!-- Discord / Twitter preview -->

  <meta name="twitter:title" content="ayomahge" />
  <meta name="twitter:description" content="we gon be ok..." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.imgur.com/L21FMmz.png?v=2">
  <link rel="apple-touch-icon" href="https://i.imgur.com/L21FMmz.png?v=2">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=3" />
</head>


<body>
  <main>

    <!-- Entry screen -->
    <section
      class="entry-screen"
      id="entryScreen"
      aria-label="Click anywhere to enter"
      role="button"
      tabindex="0"
    >
      <span class="enter-button" id="enterButton">click to enter</span>
    </section>

    <!-- Profile screen -->
    <section
      class="profile-screen"
      id="profileScreen"
      aria-label="ayomahge profile"
      aria-hidden="true"
    >
      <div class="profile-content">

        <div class="identity-row">

          <!-- Profile avatar -->
          <div class="avatar">
            <img
              src="https://i.imgur.com/QeoWGWL.png"
              alt="ayomahge profile picture"
            >
          </div>

          <div class="identity-copy">

            <div class="name-line">

              <!-- Verified badge -->
              <span class="verified" title="Verified" aria-label="Verified">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 1.8 14.6 4l3.4-.1 1.1 3.2 2.8 1.9-.9 3.3.9 3.3-2.8 1.9-1.1 3.2-3.4-.1L12 22.8l-2.6-2.2-3.4.1-1.1-3.2-2.8-1.9.9-3.3-.9-3.3 2.8-1.9L6 3.9l3.4.1L12 1.8Z"/>
                  <path class="check" d="m8.2 12.1 2.5 2.5 5.2-5.3"/>
                </svg>
              </span>

              <h1>ayomahge</h1>
            </div>

            <!-- Animated subtitle -->
            <p class="typed-line">
              <span id="typedText"></span>
              <span class="caret" aria-hidden="true">|</span>
            </p>

          </div>
        </div>

        <div class="stars" aria-hidden="true">✱ ✱ ✱ ✱</div>

      </div>

      <!-- Scroll cue -->
      <button class="scroll-cue" id="scrollCue" type="button" aria-label="Scroll for more">
        <span>SCROLL FOR MORE</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v17m-6-6 6 6 6-6"/>
        </svg>
      </button>

    </section>

    <!-- Lower section -->
    <section class="more-section" id="moreSection" aria-label="More">
      <div class="more-mark" aria-hidden="true">✳</div>
    </section>

  </main>

<script src="script.js?v=3"></script>
</body>
</html>
